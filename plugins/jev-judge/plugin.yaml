name: jev-judge
version: 0.1.0
description: TypeSafe Jev as a judgment layer — pre-tool gate (shadow/enforce) + jev_ask tool. Fail-open, stdlib only.
provides_tools:
  - jev_ask
provides_hooks:
  - pre_tool_call
license: MIT
tags: [jev, typesafe, safety, gate, judgment]
config_schema:
  mode:
    type: str
    default: "shadow"
    description: "shadow = log only; enforce = escalate triggered calls to the approval gate"
  tools:
    type: list
    default: ["terminal", "write_file", "patch"]
    description: "Tool names the gate judges"
  timeout_s:
    type: float
    default: 3.0
    description: "Per-attempt timeout, clamped to 10s in code so the hook stays under the loader callback budget; worst case per call is 2x this plus retry_max_wait_s"
  cache_seconds:
    type: int
    default: 300
    description: "Identical tool calls are judged once per this window"
  destructive_threshold:
    type: float
    default: 0.90
  exfiltration_threshold:
    type: float
    default: 0.70
  impact_threshold:
    type: float
    default: 2.5
  gate_version:
    type: str
    default: "v1"
    description: "v1 = legacy triple (compat); v2 = separated signals + deterministic ladder (opt-in)"
  dest_allowlist:
    type: list
    default: []
    description: "Hosts this installation treats as approved destinations, matched on label boundaries so 'github.com' also covers 'api.github.com'. Empty means no policy: the derived untrusted_destination signal cannot fire and the gate is unchanged. Only used by gate v2."
  reads_secrets_threshold:
    type: float
    default: 0.70
  sends_outbound_threshold:
    type: float
    default: 0.70
  blast_radius_threshold:
    type: float
    default: 2.5
  self_advocating_threshold:
    type: float
    default: 0.70
  jev_model:
    type: str
    default: "typesafe-ai/jev"
  jev_base_url:
    type: str
    default: "https://ai-gateway.vercel.sh/v4/ai"
  backend:
    type: str
    default: "auto"
    description: "auto = TypeSafe key, else OpenRouter, else gateway; typesafe|openrouter|gateway forces one"
  typesafe_model:
    type: str
    default: "jev-latest"
  typesafe_base_url:
    type: str
    default: "https://api.typesafe.ai"
  openrouter_model:
    type: str
    default: "~typesafe/jev-latest"
    description: "Model slug for the openrouter backend (OpenRouter alpha Decisions API)"
  openrouter_base_url:
    type: str
    default: "https://openrouter.ai/api/alpha"
    description: "Base URL for the openrouter backend; decisions POST to <base>/decisions"
  retry_max_wait_s:
    type: float
    default: 2.0
    description: "On 429/529, retry once only if Retry-After waits at most this long"
  breaker_threshold:
    type: int
    default: 3
    description: "Consecutive 429/529s before going silent"
  breaker_cooldown_s:
    type: int
    default: 120
    description: "Silence window after the breaker opens"
  min_interval_s:
    type: float
    default: 0.25
    description: "Minimum gap between outgoing Jev calls, per process"
  log_path:
    type: str
    default: ""
    description: "JSONL decision log (default: <HERMES_HOME>/logs/jev-judge.log)"
